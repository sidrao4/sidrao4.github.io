<!DOCTYPE HTML>
<html lang="en">
<head>
	<title>Ethics — Sidharth Rao</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" />
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--bg:        #0d0f14;
			--sidebar:   #111318;
			--surface:   #181b22;
			--border:    #23262f;
			--text:      #c9cdd6;
			--text-dim:  #5a5f6e;
			--heading:   #eaedf4;
			--accent:    #4f8ef7;
			--sidebar-w: 220px;
			--toggle-w:  36px;
			--transition: 0.25s ease;
		}

		html, body {
			height: 100%;
			font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
			font-size: 15px;
			background: var(--bg);
			color: var(--text);
			line-height: 1.7;
		}

		a { color: var(--accent); text-decoration: none; }
		a:hover { color: #7aaeff; }

		#layout { display: flex; min-height: 100vh; }

		/* ── Sidebar ── */
		#sidebar {
			width: var(--sidebar-w);
			background: var(--sidebar);
			border-right: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			position: fixed;
			top: 0; left: 0; bottom: 0;
			overflow: hidden;
			z-index: 100;
			transition: width var(--transition);
		}

		#sidebar.collapsed { width: var(--toggle-w); }

		#sidebar-toggle {
			position: absolute;
			top: 1em; right: 0.5em;
			background: none;
			border: none;
			color: var(--text-dim);
			cursor: pointer;
			font-size: 1em;
			padding: 0.3em;
			z-index: 101;
			transition: color 0.15s;
			line-height: 1;
		}
		#sidebar-toggle:hover { color: var(--accent); }

		.sidebar-content {
			opacity: 1;
			transition: opacity var(--transition);
			padding-top: 2.8em;
		}
		#sidebar.collapsed .sidebar-content { opacity: 0; pointer-events: none; }

		.brand {
			padding: 0.8em 1.4em 1.2em;
			border-bottom: 1px solid var(--border);
		}
		.brand .name { font-size: 0.95em; font-weight: 700; color: var(--heading); white-space: nowrap; }
		.brand .sub  { font-size: 0.75em; color: var(--text-dim); margin-top: 0.2em; white-space: nowrap; }

		#sidebar nav { padding: 1em 0; }
		#sidebar nav a {
			display: block;
			padding: 0.5em 1.4em;
			color: var(--text);
			font-size: 0.85em;
			font-weight: 500;
			letter-spacing: 0.02em;
			border-left: 2px solid transparent;
			white-space: nowrap;
			transition: color 0.15s, border-color 0.15s, background 0.15s;
		}
		#sidebar nav a:hover,
		#sidebar nav a.active {
			color: var(--accent);
			border-left-color: var(--accent);
			background: rgba(79,142,247,0.06);
		}

		/* ── Main ── */
		#main {
			margin-left: var(--sidebar-w);
			flex: 1;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 5em 2em;
			transition: margin-left var(--transition);
		}
		#layout.sidebar-collapsed #main { margin-left: var(--toggle-w); }

		.content-wrap {
			width: 100%;
			max-width: 780px;
		}

		.page-title {
			font-family: 'Playfair Display', Georgia, serif;
			font-size: 2.2em;
			font-weight: 600;
			color: var(--heading);
			letter-spacing: 0.01em;
			margin-bottom: 0.2em;
		}

		.page-divider {
			border: none;
			border-top: 1px solid var(--border);
			margin: 1.5em 0 2.5em;
		}

		.doc-frame {
			width: 100%;
			height: 900px;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: var(--surface);
		}

		@media (max-width: 600px) {
			#sidebar { display: none; }
			#main { margin-left: 0 !important; padding: 2.5em 1.2em; }
			.doc-frame { height: 500px; }
		}
	</style>
</head>
<body>

<div id="layout">

	<!-- Sidebar -->
	<aside id="sidebar">
		<button id="sidebar-toggle" title="Toggle sidebar">
			<i class="fas fa-bars"></i>
		</button>
		<div class="sidebar-content">
			<div class="brand">
				<div class="name">Sidharth Rao</div>
				<div class="sub">CprE Student</div>
			</div>
			<nav>
				<a href="index.html">Home</a>
				<a href="projects.html">Projects</a>
				<a href="resume.html">Resume</a>
				<a href="seniordesign.html">Senior Design</a>
				<a href="reflections.html">Reflections</a>
				<a href="ethics.html" class="active">Ethics</a>
			</nav>
		</div>
	</aside>

	<!-- Main Content -->
	<main id="main">
		<div class="content-wrap">

			<h1 class="page-title">Ethics</h1>
			<hr class="page-divider" />

			<iframe class="doc-frame"
				src="assets/394 Ethics Essay.pdf"
				frameborder="0">
			</iframe>

		</div>
	</main>
</div>

<script>
	const sidebar = document.getElementById('sidebar');
	const layout  = document.getElementById('layout');
	const toggle  = document.getElementById('sidebar-toggle');
	const icon    = toggle.querySelector('i');

	toggle.addEventListener('click', () => {
		const collapsed = sidebar.classList.toggle('collapsed');
		layout.classList.toggle('sidebar-collapsed', collapsed);
		icon.className = collapsed ? 'fas fa-chevron-right' : 'fas fa-bars';
	});
</script>

</body>
</html>
